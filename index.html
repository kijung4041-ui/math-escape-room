<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수포자를 위한 수학 방탈출</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eaf5ff;color:#23324a;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.card{background:#fff;border-radius:20px;padding:28px 24px;width:min(92vw,380px);text-align:center;border:2px solid #cfe5fa}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 18px;font-size:15px;color:#5b6b82;line-height:1.5}
input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:2px solid #b9d7f5;border-radius:12px;text-align:center;color:#23324a}
input:focus{outline:3px solid #ffd24d;border-color:#ffd24d}
button{width:100%;margin-top:12px;font-size:18px;padding:13px;border:0;border-radius:12px;background:#ffd24d;color:#23324a;font-weight:700;cursor:pointer}
.err{color:#c0392b;font-size:14px;min-height:18px;margin-top:8px}
ul{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
li{background:#e3f1ff;border-radius:999px;padding:6px 14px;font-size:15px}
li.me{background:#ffe9a6;font-weight:700}
.hide{display:none!important}
#play{position:fixed;inset:0;background:#eaf5ff;text-align:left}
#world{position:absolute;inset:0;width:100%;height:100%}
#world text{font-size:14px;fill:#23324a;font-family:inherit}
#base{position:absolute;left:18px;bottom:22px;width:116px;height:116px;border-radius:50%;background:#ffffffb3;border:2px solid #b9d7f5;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:#ffd24d;pointer-events:none}
#act{position:absolute;right:18px;bottom:40px;width:auto;margin:0;padding:14px 22px}
#modal{position:absolute;inset:0;background:#23324a99;display:flex;align-items:center;justify-content:center}
button.sub{background:#e3f1ff}
button:disabled{opacity:.5}
#mText{white-space:pre-line;color:#23324a;font-size:18px;line-height:1.7}
</style>
</head>
<body>
<main class="card">
  <section id="join" class="hide">
    <h1>수학 방탈출</h1>
    <p id="joinMsg">닉네임을 입력하고 입장하세요.</p>
    <div id="joinForm">
      <input id="nick" maxlength="8" placeholder="닉네임 (8자 이내)" autocomplete="off">
      <button id="joinBtn">입장하기</button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section id="wait" class="hide">
    <h1>대기실</h1>
    <p>선생님이 시작할 때까지 기다려 주세요.</p>
    <ul id="list"></ul>
    <p id="count"></p>
  </section>

  <section id="play" class="hide">
    <svg id="world" viewBox="0 0 680 440">
      <rect x="30" y="20" width="620" height="400" rx="14" fill="#fff" stroke="#b9d7f5" stroke-width="3"/>
      <rect x="170" y="190" width="70" height="30" rx="4" fill="#eef3f9" stroke="#cfdbe9"/>
      <rect x="445" y="190" width="70" height="30" rx="4" fill="#eef3f9" stroke="#cfdbe9"/>
      <rect x="170" y="290" width="70" height="30" rx="4" fill="#eef3f9" stroke="#cfdbe9"/>
      <rect x="445" y="290" width="70" height="30" rx="4" fill="#eef3f9" stroke="#cfdbe9"/>
      <rect x="190" y="36" width="300" height="46" rx="6" fill="#bfe8c8"/><text x="340" y="64" text-anchor="middle">칠판</text>
      <circle cx="100" cy="62" r="22" fill="#ffe08a"/><text x="100" y="102" text-anchor="middle">벽시계</text>
      <rect x="285" y="104" width="110" height="46" rx="6" fill="#d9ccf5"/><text x="340" y="132" text-anchor="middle">교탁</text>
      <rect x="34" y="170" width="16" height="120" rx="3" fill="#a9ddf0"/><text x="58" y="234">창문</text>
      <rect x="620" y="170" width="20" height="150" rx="3" fill="#ffc4b3"/><text x="610" y="248" text-anchor="end">사물함</text>
      <rect x="285" y="262" width="110" height="52" rx="6" fill="#f8c9dc"/><text x="340" y="293" text-anchor="middle">책상</text>
      <g id="actors"></g>
    </svg>
    <div id="base"><div id="knob"></div></div>
    <button id="act" class="hide"></button>
    <div id="modal" class="hide"><div class="card">
      <h1 id="mTitle"></h1>
      <p id="mText"></p>
      <div id="mForm"><input id="mAns" placeholder="정답 입력" autocomplete="off"><button id="mSubmit">확인</button></div>
      <div class="err" id="mMsg"></div>
      <button id="mClose" class="sub">닫기</button>
    </div></div>
  </section>

  <section id="end" class="hide">
    <h1>방탈출 종료</h1>
    <p>결과 화면은 다음 단계에서 만들어요.</p>
  </section>
</main>

<script type="module">
import { db, ref, onValue, set, update } from "./firebase-config.js";

const $ = id => document.getElementById(id);
let myId = sessionStorage.getItem("pid");
let state = "waiting", players = {}, gotState = false, gotPlayers = false;

function show(name){
  for (const s of ["join","wait","play","end"]) $(s).classList.toggle("hide", s !== name);
  if (name !== "play") stopGame();
}

function render(){
  if (!gotState || !gotPlayers) return;
  if (myId && !players[myId]) { sessionStorage.removeItem("pid"); myId = null; }
  if (!myId) {
    show("join");
    const open = state === "waiting";
    $("joinForm").classList.toggle("hide", !open);
    $("joinMsg").textContent = open ? "닉네임을 입력하고 입장하세요." : "이미 게임이 진행 중이에요. 선생님께 문의하세요.";
    return;
  }
  if (state === "playing") { show("play"); startGame(); return; }
  if (state === "ended") return show("end");
  show("wait");
  const names = Object.entries(players);
  $("list").replaceChildren(...names.map(([id, p]) => {
    const li = document.createElement("li");
    li.textContent = p.nick;
    if (id === myId) li.className = "me";
    return li;
  }));
  $("count").textContent = names.length + "명 입장";
}

onValue(ref(db, "game/state"), s => { state = s.val() || "waiting"; gotState = true; render(); });
onValue(ref(db, "players"), s => { players = s.val() || {}; gotPlayers = true; render(); });

async function join(){
  const nick = $("nick").value.trim();
  if (!nick) { $("err").textContent = "닉네임을 입력하세요."; return; }
  const dup = Object.values(players).some(p => p.nick.toLowerCase() === nick.toLowerCase());
  if (dup) { $("err").textContent = "이미 사용 중인 닉네임이에요. 다른 닉네임을 입력하세요."; return; }
  const id = "p" + Date.now() + Math.random().toString(36).slice(2, 6);
  try {
    await set(ref(db, "players/" + id), { nick, joinedAt: Date.now(), solved: 0 });
    sessionStorage.setItem("pid", id);
    myId = id;
    $("err").textContent = "";
    render();
  } catch (e) {
    $("err").textContent = "접속에 실패했어요. 다시 시도하세요.";
  }
}
$("joinBtn").onclick = join;
$("nick").addEventListener("keydown", e => { if (e.key === "Enter") join(); });

const NS = "http://www.w3.org/2000/svg";
const SPEED = 150;
const SPOTS = [
  { n: "교탁", q: 1, x: 285, y: 104, w: 110, h: 46 },
  { n: "칠판", q: 2, x: 190, y: 36, w: 300, h: 46 },
  { n: "책상", q: 3, x: 285, y: 262, w: 110, h: 52 },
  { n: "벽시계", q: 4, x: 78, y: 40, w: 44, h: 44 },
  { n: "사물함", q: 5, x: 620, y: 170, w: 20, h: 150 },
  { n: "창문", q: 6, x: 34, y: 170, w: 16, h: 120 }
];
let pos = { x: 340, y: 385 }, vec = { x: 0, y: 0 }, keys = {};
let shown = {}, targets = {}, raf = 0, last = 0, lastSent = 0, running = false, nearSpot = null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

onValue(ref(db, "positions"), s => { targets = s.val() || {}; });

function actor(id, nick, mine) {
  let a = shown[id];
  if (!a) {
    const g = document.createElementNS(NS, "g");
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", 11);
    c.setAttribute("fill", mine ? "#ffd24d" : "#7db7f0");
    c.setAttribute("stroke", "#23324a");
    c.setAttribute("stroke-width", 1.5);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("y", -17);
    t.textContent = nick;
    g.append(c, t);
    $("actors").append(g);
    a = shown[id] = { g, t, x: null, y: null };
  }
  return a;
}

function startGame() {
  if (running) return;
  running = true;
  pos = { x: 250 + Math.random() * 180, y: 385 };
  last = performance.now();
  lastSent = 0;
  raf = requestAnimationFrame(loop);
}

function stopGame() {
  running = false;
  cancelAnimationFrame(raf);
  vec = { x: 0, y: 0 };
  $("actors").replaceChildren();
  $("modal").classList.add("hide");
  shown = {};
}

function loop(t) {
  if (!running) return;
  const dt = Math.min((t - last) / 1000, 0.1);
  last = t;
  let vx = vec.x + ((keys.arrowright || keys.d) ? 1 : 0) - ((keys.arrowleft || keys.a) ? 1 : 0);
  let vy = vec.y + ((keys.arrowdown || keys.s) ? 1 : 0) - ((keys.arrowup || keys.w) ? 1 : 0);
  const len = Math.hypot(vx, vy);
  if (len > 1) { vx /= len; vy /= len; }
  const moved = len > 0.05;
  pos.x = clamp(pos.x + vx * SPEED * dt, 50, 630);
  pos.y = clamp(pos.y + vy * SPEED * dt, 40, 405);

  if ((moved && t - lastSent > 100) || lastSent === 0) {
    lastSent = t || 1;
    set(ref(db, "positions/" + myId), { x: Math.round(pos.x), y: Math.round(pos.y) });
  }

  if (myId && players[myId]) {
    actor(myId, players[myId].nick, true).g.setAttribute("transform", `translate(${pos.x} ${pos.y})`);
  }
  for (const id of Object.keys(targets)) {
    if (id === myId || !players[id]) continue;
    const a = actor(id, players[id].nick, false), tg = targets[id];
    const at = players[id].at && SPOTS.find(s => s.q === players[id].at);
    const label = players[id].nick + (at ? " · " + at.n + " 푸는 중" : "");
    if (a.t.textContent !== label) a.t.textContent = label;
    if (a.x === null) { a.x = tg.x; a.y = tg.y; }
    a.x += (tg.x - a.x) * 0.25;
    a.y += (tg.y - a.y) * 0.25;
    a.g.setAttribute("transform", `translate(${a.x} ${a.y})`);
  }
  for (const id of Object.keys(shown)) {
    if (id !== myId && !(players[id] && targets[id])) { shown[id].g.remove(); delete shown[id]; }
  }

  const spot = SPOTS.find(r => {
    const dx = Math.max(r.x - pos.x, 0, pos.x - (r.x + r.w));
    const dy = Math.max(r.y - pos.y, 0, pos.y - (r.y + r.h));
    return Math.hypot(dx, dy) < 38;
  }) || null;
  nearSpot = spot;
  $("act").classList.toggle("hide", !spot);
  if (spot) {
    const lab = spot.n + (isDone(spot.q) ? " ✓ 해결" : " 문제 열기");
    if ($("act").textContent !== lab) $("act").textContent = lab;
  }
  raf = requestAnimationFrame(loop);
}

const base = $("base"), knob = $("knob");
let drag = false;
function stick(e) {
  const r = base.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  const d = Math.hypot(dx, dy), m = Math.min(d, R);
  if (d > 0) { dx = dx / d * m; dy = dy / d * m; }
  knob.style.left = (R - 23 + dx) + "px";
  knob.style.top = (R - 23 + dy) + "px";
  vec = { x: dx / R, y: dy / R };
}
function endStick() {
  drag = false;
  vec = { x: 0, y: 0 };
  knob.style.left = "35px";
  knob.style.top = "35px";
}
base.addEventListener("pointerdown", e => { drag = true; base.setPointerCapture(e.pointerId); stick(e); });
base.addEventListener("pointermove", e => { if (drag) stick(e); });
base.addEventListener("pointerup", endStick);
base.addEventListener("pointercancel", endStick);
window.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

const norm = v => v.replace(/[\s,.·!?]/g, "");
const PROBLEMS = {
  2: { num: true, text: "973, 189, ??, 14, 4\n\n??에 들어갈 숫자는?", ok: v => norm(v) === "72" },
  4: { num: true, text: "11 × 11 = 4\n22 × 22 = 16\n33 × 33 = 36\n44 × 44 = ??\n\n??에 들어갈 숫자는?", ok: v => norm(v) === "64" },
  6: { num: false, text: "5는 0을 이기고\n0은 2를 이기고\n2는 5를 이기는 것은?", ok: v => norm(v) === "가위바위보" }
};
let openSpot = null, locked = false;
const isDone = q => !!(players[myId] && players[myId].done && players[myId].done[q]);
const setAt = q => { if (myId) update(ref(db, "players/" + myId), { at: q }); };

$("act").onclick = () => {
  if (!nearSpot) return;
  openSpot = nearSpot;
  const q = openSpot.q, p = PROBLEMS[q];
  $("mTitle").textContent = openSpot.n;
  $("mMsg").textContent = "";
  $("mAns").value = "";
  if (isDone(q)) {
    $("mText").textContent = "이미 푼 문제예요. 다른 곳도 찾아보세요!";
    $("mForm").classList.add("hide");
  } else if (!p) {
    $("mText").textContent = "이 문제는 다음 단계에서 만들어요.";
    $("mForm").classList.add("hide");
  } else {
    $("mText").textContent = p.text;
    $("mAns").inputMode = p.num ? "numeric" : "text";
    $("mForm").classList.remove("hide");
  }
  $("modal").classList.remove("hide");
  setAt(q);
};

function closeModal() {
  $("modal").classList.add("hide");
  openSpot = null;
  setAt(null);
}
$("mClose").onclick = closeModal;

async function submit() {
  if (!openSpot || locked) return;
  const v = $("mAns").value.trim();
  if (!v) return;
  const q = openSpot.q;
  if (PROBLEMS[q].ok(v)) {
    $("mMsg").style.color = "#2e8b57";
    $("mMsg").textContent = "정답이에요! 🎉";
    const done = Object.keys((players[myId] && players[myId].done) || {});
    if (!done.includes(String(q))) done.push(String(q));
    const upd = { ["done/" + q]: true, solved: done.length };
    if (done.length === SPOTS.length) upd.finishedAt = Date.now();
    await update(ref(db, "players/" + myId), upd);
    setTimeout(closeModal, 900);
  } else {
    $("mMsg").style.color = "#c0392b";
    $("mMsg").textContent = "아쉬워요. 다시 생각해 보세요.";
    locked = true;
    $("mSubmit").disabled = true;
    setTimeout(() => { locked = false; $("mSubmit").disabled = false; }, 2000);
  }
}
$("mSubmit").onclick = submit;
$("mAns").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
</script>
</body>
</html>
